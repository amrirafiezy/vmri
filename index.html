<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMRI STORE // OFFICIAL CATALOG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 22, 34, 0.9);
      --accent: #00f0ff;
      --accent-alt: #00ff88;
      --border: rgba(0, 240, 255, 0.2);
      --text: #f0f4f8;
      --muted: #8b9bb4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(0, 255, 136, 0.08) 0%, transparent 40%);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .header {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 40px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid var(--border);
      color: var(--accent);
      border-radius: 100px;
      font-size: 0.8rem;
      font-family: 'Fira Code', monospace;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    p.sub {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* GRID BARANG */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 900px;
      margin: 0 auto 40px;
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .item-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 15px 40px rgba(0, 240, 255, 0.15);
    }
    .item-img {
      width: 100%;
      height: 180px;
      border-radius: 14px;
      background: #151922;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      object-fit: cover;
    }
    .item-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .item-desc {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 16px;
      flex-grow: 1;
    }
    .item-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .price {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--accent-alt);
      font-family: 'Fira Code', monospace;
    }
    .btn-buy {
      background: var(--accent);
      color: #000;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .btn-buy:hover {
      background: #fff;
      box-shadow: 0 0 15px var(--accent);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      font-family: 'Fira Code', monospace;
    }
  </style>
</head>

    <h1>VMRI STORE</h1>
    <p class="sub">Barang premium & padu pilihan VMRI. Tekan order terus ke WhatsApp!</p>
  </div>
