<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VMRI // OFFICIAL TERMINAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 22, 34, 0.85);
      --accent: #00f0ff;
      --accent-alt: #00ff88;
      --border: rgba(0, 240, 255, 0.2);
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(0, 255, 136, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 240, 255, 0.1);
      text-align: center;
      position: relative;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: var(--accent);
      border-radius: 100px;
      font-size: 0.8rem;
      font-family: 'Fira Code', monospace;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .avatar {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 28px;
      background: linear-gradient(135deg, #00f0ff, #0051ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 900;
      color: #05070f;
      border: 2px solid var(--accent);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      margin-bottom: 6px;
    }
    p.tagline {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-family: 'Fira Code', monospace;
      margin-bottom: 28px;
    }
    .aura-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px dashed rgba(0, 255, 136, 0.3);
      padding: 12px;
      border-radius: 14px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .aura-item span {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .aura-item strong {
      color: var(--accent-alt);
      font-size: 1.1rem;
      font-family: 'Fira Code', monospace;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }
    .link-btn:hover {
      background: rgba(0, 240, 255, 0.12);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.2);
    }
    .footer {
      margin-top: 26px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">SYS // ONLINE</div>
    <div class="avatar">V</div>
    <h1>VMRI</h1>
    <p class="tagline">// student.dev • network & code //</p>

    <div class="aura-box">
      <div class="aura-item">
        <span>STATUS</span>
        <strong>SIGMA MODE</strong>
      </div>
      <div class="aura-item">
        <span>AURA</span>
        <strong>+999,999</strong>
      </div>
      <div class="aura-item">
        <span>RIDE</span>
        <strong>STEALTH</strong>
      </div>
    </div>

    <div class="links">
      <a href="https://github.com/amrirafiezy" target="_blank" class="link-btn">
        <span>💻 GitHub Portfolio</span>
        <span>→</span>
      </a>
      <a href="https://instagram.com" target="_blank" class="link-btn">
        <span>📸 Instagram</span>
        <span>→</span>
      </a>
      <a href="mailto:contact@vmri.dev" class="link-btn">
        <span>📩 Direct Contact</span>
        <span>→</span>
      </a>
    </div>

    <div class="footer">
      DEPLOYED WITH MAXIMUM AURA • 2026
    </div>
  </div>
</body>
</html>
